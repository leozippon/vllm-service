# Trusted shell configuration for the qwen-3.8-27b-fp8 deployment.
VLLM_PYTHON=/Data/public/.venvs/vllm-runtime-py311/bin/python
VLLM_MODEL_PATH=/Data/public/Qwen3.8-27B-FP8
VLLM_SERVED_MODEL_NAME=qwen-3.8-27b-fp8
VLLM_GPUS=6,7
VLLM_CPU_AFFINITY=48-63
VLLM_NUMA_NODES=1

VLLM_RUNTIME_ENV=(
    "CUDA_VISIBLE_DEVICES=$VLLM_GPUS"
    "CUDA_DEVICE_ORDER=PCI_BUS_ID"
    "HF_HUB_OFFLINE=1"
    "TRANSFORMERS_OFFLINE=1"
    "PATH=/Data/public/.venvs/vllm-runtime-py311/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
)

VLLM_ARGS=(
    --host 127.0.0.1
    --port 8010
    --tensor-parallel-size 2
    --max-model-len 262144
    --kv-cache-dtype fp8_e4m3
    --enable-auto-tool-choice
    --tool-call-parser qwen3_coder
    --reasoning-parser qwen3
    --enable-prefix-caching
    --max-num-batched-tokens 8192
    --kv-offloading-size 32
)
