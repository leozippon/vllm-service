# Trusted shell configuration for the qwen-3.8-27b-fp8 deployment.
VLLM_PYTHON=/Data/public/.venvs/vllm-runtime-py311/bin/python
VLLM_MODEL_PATH=/Data/public/Qwen3.8-27B-FP8
VLLM_SERVED_MODEL_NAME=qwen-3.8-27b-fp8
# The engine binds this port; the gateway answers on the next one.
VLLM_PORT=8010
VLLM_GPUS=6,7
# Policy, not topology: how much of the GPUs' own NUMA node this deployment may
# take on a shared host. The node and the CPU pool are derived from VLLM_GPUS;
# set VLLM_NUMA_NODES and VLLM_CPU_AFFINITY here to override that derivation.
VLLM_CPU_CORES=16

# This model's chat template names its top reasoning tier "xhigh" and rejects
# OpenAI's "high"; the gateway renames the one to the other.
VLLM_GATEWAY_REASONING_EFFORT_ALIAS=high:xhigh

VLLM_RUNTIME_ENV=(
    "CUDA_DEVICE_ORDER=PCI_BUS_ID"
    "HF_HUB_OFFLINE=1"
    "TRANSFORMERS_OFFLINE=1"
    "PATH=/Data/public/.venvs/vllm-runtime-py311/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
)

VLLM_ARGS=(
    --host 127.0.0.1
    --tensor-parallel-size 2
    --max-model-len 262144
    --kv-cache-dtype fp8_e4m3
    --enable-auto-tool-choice
    --tool-call-parser qwen3_coder
    --reasoning-parser qwen3
    --enable-prefix-caching
    --max-num-batched-tokens 8192
    --kv-offloading-size 32
)
