# The shared deployment: the qwen-3.8-27b-fp8 profile on two GPUs at the model's
# native context, behind the authenticated gateway.
VLLM_PROFILE=qwen-3.8-27b-fp8
# The engine binds this port; the gateway answers on the next one.
VLLM_PORT=8010
VLLM_GPUS=6,7
# Policy, not topology: how much of the GPUs' own NUMA node this deployment may
# take on a shared host. The node and the CPU pool are derived from VLLM_GPUS;
# set VLLM_NUMA_NODES and VLLM_CPU_AFFINITY here to override that derivation.
VLLM_CPU_CORES=16

# run-vllm options on top of the profile's defaults.
VLLM_LAUNCH_ARGS=(
    --tensor-parallel-size 2
    --max-model-len 262144
    # Two cards hold state for far more sequences than one; 256 is vLLM's own
    # default on this GPU, which this deployment has always run with.
    --extra-arg --max-num-seqs
    --extra-arg 256
    # The profile turns thinking off for direct answers; this deployment keeps
    # the model's own default, thinking on, which the reasoning-effort alias
    # below steers.
    --extra-arg --default-chat-template-kwargs
    --extra-arg '{"enable_thinking": true}'
)

# This model's chat template names its top reasoning tier "xhigh" and rejects
# OpenAI's "high"; the gateway renames the one to the other.
VLLM_GATEWAY_REASONING_EFFORT_ALIAS=high:xhigh
