# Trusted shell configuration for the qwen-3.8-27b-fp8 deployment.
VLLM_PYTHON=/Data/lzp/vllm-service/.venv/bin/python
VLLM_MODEL_PATH=/Data/public/Qwen3.8-27B-FP8
VLLM_SERVED_MODEL_NAME=qwen-3.8-27b-fp8
# The engine binds this port; the gateway answers on the next one.
VLLM_PORT=8010
VLLM_GPUS=6,7
# Policy, not topology: how much of the GPUs' own NUMA node this deployment may
# take on a shared host. The node and the CPU pool are derived from VLLM_GPUS;
# set VLLM_NUMA_NODES and VLLM_CPU_AFFINITY here to override that derivation.
VLLM_CPU_CORES=16

# This model's chat template names its top reasoning tier "xhigh" and rejects
# OpenAI's "high"; the gateway renames the one to the other.
VLLM_GATEWAY_REASONING_EFFORT_ALIAS=high:xhigh

VLLM_RUNTIME_ENV=(
    "CUDA_DEVICE_ORDER=PCI_BUS_ID"
    "HF_HUB_OFFLINE=1"
    "TRANSFORMERS_OFFLINE=1"
    "PATH=/Data/lzp/vllm-service/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
)

VLLM_ARGS=(
    --host 127.0.0.1
    --tensor-parallel-size 2
    --max-model-len 262144
    --kv-cache-dtype fp8_e4m3
    --enable-auto-tool-choice
    --tool-call-parser qwen3_coder
    --reasoning-parser qwen3
    --enable-prefix-caching
    --max-num-batched-tokens 8192
    # The CPU tier only pays off while it is larger than the GPU KV pool it
    # backs: at 32 GiB it held 668 blocks against the pool's 867, so a prefix
    # evicted from GPU had less history depth in CPU than it had just lost, and
    # the measured external hit rate was 0.11% lifetime and 0% over an 11-minute
    # window. 64 GiB is 1.54x the pool and survives ~58 minutes of the observed
    # eviction rate, which spans the interval over which a parent context waits
    # for its children. Restoring a prefix runs at 499k tokens/s against 2.4k
    # tokens/s to recompute it.
    --kv-offloading-size 64
)
