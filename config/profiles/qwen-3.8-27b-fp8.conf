# Qwen3.8-27B-FP8: the vendor's block-FP8 (128x128) checkpoint of Qwen3.8-27B, a
# dense vision-language model on the hybrid Gated DeltaNet / full-attention
# design, with a native 262,144-token window.
# Release: August 2026, the date of the README's citation (Qwen Team,
# "Qwen3.8-Max: A New Bar for Coding and Cowork"). Knowledge cutoff: not stated
# in the README.
VLLM_MODEL_PATH=/Data/public/Qwen3.8-27B-FP8
VLLM_SERVED_MODEL_NAME=qwen-3.8-27b-fp8
VLLM_TASK=generate
VLLM_RELEASE_DATE=2026-08
VLLM_KNOWLEDGE_CUTOFF=
VLLM_NOTE="Qwen3.8 27B dense vision-language model, vendor block-FP8 weights, native window 262,144 tokens; defaults fit one L20 at 32,768 tokens; thinking off unless a request sets chat_template_kwargs.enable_thinking"

# Defaults for one 45 GiB L20: the weights fit on one card, and the KV cache that
# remains holds several concurrent requests at 32,768 tokens but not one at the
# native window, which needs two cards.
VLLM_TENSOR_PARALLEL_SIZE=1
VLLM_MAX_MODEL_LEN=32768

VLLM_ARGS=(
    # FP8 KV cache was adopted on measurement; see eval/PHASE4_RESULTS.md.
    --kv-cache-dtype fp8_e4m3
    --enable-prefix-caching
    --max-num-batched-tokens 8192
    # Every running sequence holds one linear-attention state block, and one
    # card has room for 167 of them at the default memory fraction, fewer than
    # vLLM's default of 256 sequences, which then refuses to start.
    --max-num-seqs 128
    --enable-auto-tool-choice
    --tool-call-parser qwen3_coder
    --reasoning-parser qwen3
    # Thinking stays off unless a request sets chat_template_kwargs.enable_thinking,
    # so a plain chat completion returns its answer as plain content.
    --default-chat-template-kwargs '{"enable_thinking": false}'
)

# CPU KV offloading is deliberately absent. Measured under real agent traffic at
# 64 GiB it returned 4.59% of the lookups that reached it and wrote 48 bytes for
# every byte it gave back, spending more transfer time than the prefill it saved;
# the GPU prefix cache already answers about 95%. Re-enabling it needs new
# evidence, not a guess -- see LOGBOOK.md, 2026-08-28.
