# Qwen3.5-2B: Qwen's 2B vision-language model on the hybrid Gated DeltaNet /
# full-attention design, BF16 weights, with a native 262,144-token window.
# Release: February 2026, the date of the README's citation (Qwen Team,
# "Qwen3.5: Towards Native Multimodal Agents"). Knowledge cutoff: not stated in
# the README.
VLLM_MODEL_PATH=/Data/public/Qwen3.5-2B
VLLM_SERVED_MODEL_NAME=qwen-3.5-2b
VLLM_TASK=generate
VLLM_RELEASE_DATE=2026-02
VLLM_KNOWLEDGE_CUTOFF=
VLLM_NOTE="Qwen3.5 2B vision-language model, BF16 weights, native window 262,144 tokens on one L20; thinking off unless a request sets chat_template_kwargs.enable_thinking"

VLLM_TENSOR_PARALLEL_SIZE=1
VLLM_MAX_MODEL_LEN=262144

VLLM_ARGS=(
    --enable-prefix-caching
    --enable-auto-tool-choice
    --tool-call-parser qwen3_coder
    --reasoning-parser qwen3
    # Thinking stays off unless a request sets chat_template_kwargs.enable_thinking,
    # so a plain chat completion returns its answer as plain content.
    --default-chat-template-kwargs '{"enable_thinking": false}'
)
