# Qwen3-Embedding-0.6B: Qwen's 0.6B text embedding model, BF16 weights,
# 1024-dimensional last-token embeddings, normalised, over inputs of up to
# 32,768 tokens. Queries carry an instruction prefix ("Instruct: <task>\nQuery: ");
# documents do not.
# Release: June 2025, from the README (its citation is arXiv 2506.05176, and it
# quotes the MTEB leaderboard "as of June 5, 2025"). Knowledge cutoff: not
# stated in the README.
VLLM_MODEL_PATH=/Data/public/Qwen3-Embedding-0.6B
VLLM_SERVED_MODEL_NAME=qwen3-embedding-0.6b
VLLM_TASK=embed
VLLM_RELEASE_DATE=2025-06
VLLM_KNOWLEDGE_CUTOFF=
VLLM_NOTE="Qwen3 text embedding model, 0.6B, BF16, 1024-dimensional normalised embeddings through /v1/embeddings, inputs up to 32,768 tokens; queries take an instruction prefix, documents none"

VLLM_TENSOR_PARALLEL_SIZE=1
VLLM_MAX_MODEL_LEN=32768

# Pooling (last token) and normalisation come from the checkpoint's
# sentence-transformers configuration.
VLLM_ARGS=()
